appId: com.firmino.app
productName: Firmino
directories:
  output: release
files:
  - out/**
  - resources/icon.png
  - package.json
  - "!node_modules/**"
extraResources:
  - from: dist-engine
    to: engine
npmRebuild: false
linux:
  target: AppImage
  executableName: firmino
  category: Utility
  synopsis: Secretário pessoal que fica aberto no seu computador
  syncDesktopName: true
  icon: resources/icon.png
